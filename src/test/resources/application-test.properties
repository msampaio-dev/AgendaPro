# Valores de seguranca exclusivos do ambiente de testes.
# A conexao real e substituida pelo @ServiceConnection do Testcontainers.
spring.datasource.url=jdbc:postgresql://localhost:1/agendapro_test
spring.datasource.username=agendapro_test
spring.datasource.password=agendapro_test

app.security.jwt.secret=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

# Mantém a suíte determinística mesmo que o ambiente local possua essas variáveis.
app.bootstrap.admin.enabled=false
app.web.cors.allowed-origins=http://localhost:5173
