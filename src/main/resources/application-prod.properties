spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=framework
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# O plano free do Render da 0.1 CPU: instanciar todos os beans no arranque levava
# 171s, tempo que o health check nao espera. Lazy init adia o que nao e usado no
# boot. O ApplicationRunner do primeiro admin continua rodando: o Spring Boot
# resolve runners na inicializacao mesmo com lazy init ligado.
spring.main.lazy-initialization=true
