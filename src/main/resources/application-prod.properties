spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=framework
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# O plano free do Render da 0.1 CPU: instanciar todos os beans no arranque levava
# 171s, tempo que o health check nao espera. Lazy init adia o que nao e usado no
# boot. O ApplicationRunner do primeiro admin continua rodando: o Spring Boot
# resolve runners na inicializacao mesmo com lazy init ligado.
spring.main.lazy-initialization=true

# O Neon suspende o compute sozinho depois de alguns minutos ocioso e derruba as
# conexoes abertas. O pool nao deve guardar conexao que o banco ja fechou, nem
# demorar 30s para desistir de uma que nao responde.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000

# keepalive-time fica de fora de proposito: pingar o banco para mante-lo acordado
# estouraria a cota de compute do plano free do Neon.

# Paga o custo do lazy initialization logo apos o arranque, e nao na primeira
# requisicao de quem abrir o sistema. Ver AquecimentoAplicacao.
app.aquecimento.enabled=true
