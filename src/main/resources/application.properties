spring.application.name=agendapro
spring.profiles.default=dev

# Plataformas de hospedagem (Render, Railway, Heroku) injetam a porta em PORT.
server.port=${PORT:8080}

# Por padrao apenas o schema. A carga de demonstracao vive em db/devdata e e
# adicionada pelo perfil dev ou por FLYWAY_LOCATIONS no ambiente publicado.
spring.flyway.locations=${FLYWAY_LOCATIONS:classpath:db/migration}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A autenticacao do AgendaPro e definida no modulo auth, sem usuario temporario em memoria.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=60

# Bootstrap opcional e de uso único para criar o primeiro administrador.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Sugestao de agendamento por IA. A demonstracao e publica e cada chamada custa
# dinheiro: o limite por usuario segura o uso normal e o global segura quem cria
# contas novas para fugir do primeiro.
app.ia.sugestao.limite-por-usuario=${IA_SUGESTAO_LIMITE_POR_USUARIO:10}
app.ia.sugestao.limite-global=${IA_SUGESTAO_LIMITE_GLOBAL:200}

# A chave existe apenas como variavel de ambiente. Vazia, a sugestao responde 503
# e o frontend usa o fluxo manual; o resto da aplicacao nao depende dela.
app.ia.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.ia.anthropic.modelo=${IA_MODELO:claude-haiku-5-5}
app.ia.anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
