spring.application.name=agendapro
spring.profiles.default=dev

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# A autenticacao do AgendaPro e definida no modulo auth, sem usuario temporario em memoria.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-minutes=60

# Bootstrap opcional e de uso único para criar o primeiro administrador.
app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.nome=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.senha=${BOOTSTRAP_ADMIN_PASSWORD:}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
