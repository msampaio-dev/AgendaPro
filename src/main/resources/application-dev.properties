spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/agendapro}
spring.datasource.username=${DB_USERNAME:agendapro_user}
spring.datasource.password=${DB_PASSWORD}

app.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Dados demonstrativos existem apenas no ambiente local; produção recebe somente migrations estruturais.
spring.flyway.locations=classpath:db/migration,classpath:db/devdata
